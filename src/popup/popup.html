<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Clipper for Google Drive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../../icons/icon-48.png" alt="Logo" class="logo">
        <h1 data-i18n="extensionName">Magic Clipper Drive</h1>
      </div>
      <button id="auth-btn" class="btn-secondary btn-sm">Google Drive</button>
    </header>

    <!-- Email Card -->
    <section class="card email-card">
      <div class="card-header">
        <span class="badge">Email Affiché</span>
      </div>
      <h2 id="email-subject" class="email-subject">Chargement...</h2>
      <p id="email-author" class="email-meta">De : --</p>
      <p id="email-date" class="email-meta">Date : --</p>
    </section>

    <!-- Options Section -->
    <section class="card options-card">
      <!-- Format Selection / Email Body -->
      <div class="option-group">
        <label class="group-title">Format du corps de l'email</label>
        <div class="segmented-control" id="format-selection-group">
          <input type="radio" id="format-none" name="clip-format" value="none" checked>
          <label for="format-none">Ne pas importer</label>

          <input type="radio" id="format-pdf" name="clip-format" value="pdf">
          <label for="format-pdf">PDF</label>

          <input type="radio" id="format-md" name="clip-format" value="markdown">
          <label for="format-md">Markdown</label>
        </div>
      </div>

      <!-- Attachments Selection -->
      <div class="option-group" id="attachments-group">
        <label class="group-title">Pièces Jointes détectées (<span id="attachments-count">0</span>)</label>
        <div id="attachments-list" class="attachments-list">
          <p class="empty-hint">Aucune pièce jointe dans cet email.</p>
        </div>
      </div>

      <!-- User Note / Grounding -->
      <div class="option-group">
        <label for="user-note-input" class="group-title">Note / Intention personnalisée (optionnel)</label>
        <textarea id="user-note-input" rows="2" placeholder="Ajouter un contexte ou une note d'archivage..."></textarea>
      </div>
    </section>

    <!-- Action Section -->
    <footer class="app-footer">
      <div id="status-message" class="status-message hidden"></div>
      <div id="drive-result-actions" class="drive-result-actions hidden">
        <a id="open-folder-btn" href="#" target="_blank" class="btn-secondary btn-drive-folder">
          📂 Ouvrir le dossier sur Drive ↗
        </a>
        <div id="drive-file-links" class="drive-file-links"></div>
      </div>
      <button id="clip-btn" class="btn-primary">
        <span>Clipper vers Google Drive</span>
      </button>
    </footer>
  </div>

  <script src="../shared/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
